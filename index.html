<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>文具の棚</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="文具の棚">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1E5754">
<style>
:root{
  color-scheme:light;
  --bg:#ECF1F0;--surface:#FFFFFF;--ink:#16302E;--muted:#5C7270;--line:#D0DCDA;
  --teal:#1E5754;--on-teal:#FFFFFF;--teal-soft:#D6E6E4;
  --terra:#B4552F;--on-terra:#FFFFFF;--terra-soft:#F3DED3;
  --board:#C9B49E;--board-edge:#A48B73;
  --oshi-bg:#1E5754;--oshi-ink:#F2F8F7;--oshi-muted:#B9D3D0;
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg:#0E1A1A;--surface:#162626;--ink:#E4EEED;--muted:#93A7A5;--line:#283B3A;
    --teal:#7BBDB7;--on-teal:#0E1A1A;--teal-soft:#1F3634;
    --terra:#E38B64;--on-terra:#1A0F0A;--terra-soft:#3A2820;
    --board:#4A3C30;--board-edge:#30261D;
    --oshi-bg:#1D3735;--oshi-ink:#E9F3F2;--oshi-muted:#9DBAB7;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;line-height:1.6}
body{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--terra);outline-offset:2px}
.wrap{padding:0 16px}

header.top{padding:calc(16px + env(safe-area-inset-top)) 18px 4px;display:flex;align-items:baseline;justify-content:space-between}
header.top h1{font-size:26px;margin:0;letter-spacing:.06em;font-weight:700}
header.top span{color:var(--muted);font-size:13px}

/* 今日の推し */
.oshi{margin:10px 16px 6px;background:var(--oshi-bg);color:var(--oshi-ink);border-radius:18px;padding:14px;display:flex;gap:14px;align-items:center}
.oshi-ph{flex:0 0 112px;height:112px;border:0;padding:0;border-radius:12px;overflow:hidden;background:var(--surface);display:grid;place-items:center}
.oshi-ph img{width:100%;height:100%;object-fit:cover}
.oshi-body{min-width:0}
.oshi-lead{margin:0;font-size:12px;color:var(--oshi-muted)}
.oshi-name{margin:2px 0 0;font-size:17px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.oshi-sub{margin:2px 0 10px;font-size:12px;color:var(--oshi-muted)}
.oshi-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn.on-dark{background:transparent;color:var(--oshi-ink);border:1px solid var(--oshi-muted)}

/* 操作 */
.ctrl{padding:10px 16px 0}
.ctrl input[type=search]{width:100%;font-size:16px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.seg{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;white-space:nowrap}
.seg button.on{background:var(--teal);color:var(--on-teal);border-color:var(--teal)}
.seg.sub button{font-size:12px;padding:4px 11px}
.seg.sub button.on{background:var(--terra-soft);color:var(--ink);border-color:var(--terra)}

/* 棚 */
.shelf{margin:22px 0 4px}
.shelf h3{font-size:15px;margin:0 18px 8px;display:flex;gap:8px;align-items:baseline}
.shelf h3 small{color:var(--muted);font-weight:400;font-size:12px}
.row{display:flex;align-items:flex-end;gap:12px;overflow-x:auto;padding:0 16px 10px;
  border-bottom:8px solid var(--board);box-shadow:0 3px 0 var(--board-edge);
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.card{flex:0 0 104px;scroll-snap-align:start;background:none;border:0;padding:0;text-align:left}
.ph{position:relative;width:104px;height:104px;border-radius:10px;background:var(--surface);overflow:hidden;display:grid;place-items:center;border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover}
.ini{font-size:30px;color:var(--terra);font-weight:700}
.badge{position:absolute;left:5px;top:5px;font-size:10px;padding:1px 6px;border-radius:999px;background:var(--terra);color:var(--on-terra)}
.badge.done{background:var(--muted);color:var(--surface)}
.card .nm{font-size:12px;line-height:1.35;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .mk{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.empty{text-align:center;padding:40px 22px;color:var(--muted)}
.empty p{margin:0 0 8px}
.empty .btn{margin:8px 4px 0}

/* ボタン */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--terra);color:var(--on-terra);border:0;border-radius:12px;padding:11px 16px;font-weight:700;font-size:14px;cursor:pointer}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--terra);border:1px solid var(--terra)}
.btn.wide{width:100%;margin-top:12px}
.btn[disabled]{opacity:.55}
.link{background:none;border:0;color:var(--teal);font-size:15px;padding:6px 2px}
.link.strong{font-weight:700}

/* タブ */
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.tabs button{flex:1;background:none;border:0;padding:12px 4px 10px;font-size:13px;color:var(--muted)}
nav.tabs button.on{color:var(--teal);font-weight:700}
nav.tabs .plus{flex:0 0 auto;width:52px;height:52px;border-radius:50%;background:var(--terra);color:var(--on-terra);font-size:28px;line-height:1;margin:-18px 8px 0;box-shadow:0 3px 0 var(--board-edge)}

/* シート */
.sheet{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:20;transform:translateY(100%);transition:transform .28s ease;padding-bottom:calc(40px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sheet.open{transform:none}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet-head{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line)}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:var(--surface);scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:0 0 100%;width:100%;aspect-ratio:1/1;object-fit:cover;scroll-snap-align:center;background:var(--teal-soft)}
.galcount{font-size:12px;color:var(--muted);margin:6px 16px 0}
.nophoto{margin:16px;padding:22px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);font-size:13px;text-align:center}
.dname{font-size:21px;margin:14px 0 0;line-height:1.4}
.dmaker{margin:2px 0 0;color:var(--muted)}
.dbtns{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.info{display:grid;grid-template-columns:7.5em 1fr;gap:8px 12px;margin:8px 0 0;font-size:14px}
.info dt{color:var(--muted)}
.info dd{margin:0;white-space:pre-wrap;word-break:break-word}

/* フォーム */
.form label{display:block;font-size:12px;color:var(--muted);margin-top:12px}
.form input,.form select,.form textarea,.review input,.review select,#imp-text,#restore{display:block;width:100%;margin-top:4px;font-size:16px;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.janrow{display:flex;gap:8px;margin-top:4px}
.janrow input{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12px}
.chip.on{background:var(--teal);color:var(--on-teal);border-color:var(--teal)}
.photos,.imgs{display:flex;gap:8px;overflow-x:auto;padding:14px 0 2px}
.imgbox{position:relative;flex:0 0 86px;height:86px}
.imgbox img{width:86px;height:86px;object-fit:cover;border-radius:10px;background:var(--teal-soft)}
.imgbox button{position:absolute;right:-4px;top:-4px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:13px;line-height:24px;padding:0}
.addimg{flex:0 0 86px;height:86px;border:1.5px dashed var(--terra);border-radius:10px;display:grid;place-items:center;color:var(--terra);font-size:13px;font-weight:700;margin:0 !important}
.note{font-size:12px;color:var(--muted);margin:6px 0 0}
.note.warn{color:var(--terra)}

/* 買い物 */
.sec{font-size:17px;margin:24px 0 6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.stat p{margin:0;font-size:11px;color:var(--muted)}
.stat b{display:block;font-size:18px;margin-top:2px;font-variant-numeric:tabular-nums}
.bars{display:flex;align-items:flex-end;gap:4px;height:130px;margin-top:10px;padding:8px 8px 0;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;color:var(--muted)}
.bar i{display:block;width:100%;max-width:18px;background:var(--teal);border-radius:4px 4px 0 0;min-height:2px}
.bar.now i{background:var(--terra)}
.bar span{padding:3px 0 6px}
.rank{list-style:none;margin:8px 0 0;padding:0}
.rank li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.rank li span:last-child{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.order{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.otop{display:flex;gap:10px;align-items:baseline;font-size:14px}
.otop .d{color:var(--muted);font-size:12px;white-space:nowrap}
.otop .s{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.otop b{font-variant-numeric:tabular-nums}

/* 取り込み確認 */
.review{margin-top:18px}
.review h3{font-size:16px;margin:0}
.order-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
.order-box label{display:block;font-size:12px;color:var(--muted)}
.ri{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.ri input,.ri select{margin-top:6px}
.chk{display:flex !important;align-items:center;gap:8px;font-size:13px !important;color:var(--ink) !important}
.chk input{width:auto !important;margin:0 !important}

#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;max-width:88vw;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<header class="top"><h1>文具の棚</h1><span id="count"></span></header>
<main id="view"><p class="empty">読み込んでいます…</p></main>
<nav class="tabs">
  <button data-act="tab" data-k="shelf">棚</button>
  <button data-act="tab" data-k="shop">買い物</button>
  <button class="plus" data-act="add" aria-label="文具を追加">＋</button>
  <button data-act="tab" data-k="import">取り込み</button>
</nav>
<div id="sheet" class="sheet" aria-modal="true" role="dialog"></div>
<div id="toast" role="status"></div>

<script>
function showFatal(msg){const v=document.getElementById('view');if(v)v.innerHTML='<div class="empty"><p>起動中にエラーが出ました。この画面のスクショを送ってください。</p><p style="font-size:12px;word-break:break-all">'+String(msg).replace(/[<>&]/g,'')+'</p></div>';}
window.addEventListener('error',e=>showFatal(e.message+' ('+(e.lineno||'')+')'));
window.addEventListener('unhandledrejection',e=>showFatal(e.reason&&e.reason.message?e.reason.message:e.reason));
const CATS=['スタンプ','ノート','手帳リフィル','バインダー','シール','シール台紙','ふせん','ロールふせん','メモ帳','デザインペーパー','マスキングテープ','ボールペン','カラーペン','万年筆','つけペン','インク','その他'];
const STATUS=['未開封','使用中','使い切り'];
const DEF_TAGS=['M6','ロルバーン','デコ','日記','手紙','仕事','スクラップ','コラージュ'];
const GROUPS=[['cat','剤型'],['maker','作家'],['tag','用途'],['status','状態'],['place','保管場所']];

let db={items:[],orders:[]};
let thumbs={};
let ui={tab:'shelf',group:'cat',status:'all',q:'',oshi:0};
let form=null;
let imp={images:[],text:'',result:null,busy:false,msg:''};
let restoreArm=false;

const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const yen=n=>(n===''||n==null||isNaN(n))?'—':'¥'+Number(n).toLocaleString('ja-JP');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const daysSince=s=>Math.max(0,Math.round((new Date(today())-new Date(s))/864e5));

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2200);}

/* ---------- 保存 ---------- */
// Claude上では window.storage、それ以外のブラウザでは端末内(IndexedDB)に保存
const store={mode:'none',idb:null,
  async init(){
    if(window.storage&&typeof window.storage.set==='function'){
      try{const r=await window.storage.set('stn-ping',String(Date.now()),false);if(r){this.mode='claude';return;}}catch(e){}
    }
    try{this.idb=await new Promise((res,rej)=>{setTimeout(()=>rej(new Error('timeout')),3000);if(!window.indexedDB)return rej(new Error('no idb'));const q=indexedDB.open('bungu-tana',1);
      q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});
      this.mode='device';if(!(await this.set('stn-ping',String(Date.now()))))this.mode='none';}catch(e){this.mode='none';}
  },
  async get(k){
    if(this.mode==='claude'){try{const r=await window.storage.get(k,false);return r?r.value:null;}catch(e){return null;}}
    if(this.mode==='device')return new Promise(res=>{try{const q=this.idb.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result??null);q.onerror=()=>res(null);}catch(e){res(null);}});
    return null;
  },
  async set(k,v){
    if(this.mode==='claude'){try{return !!(await window.storage.set(k,v,false));}catch(e){return false;}}
    if(this.mode==='device')return new Promise(res=>{try{const tx=this.idb.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);tx.onabort=()=>res(false);}catch(e){res(false);}});
    return false;
  },
  async del(k){
    if(this.mode==='claude'){try{await window.storage.delete(k,false);}catch(e){}return;}
    if(this.mode==='device')return new Promise(res=>{try{const tx=this.idb.transaction('kv','readwrite');tx.objectStore('kv').delete(k);tx.oncomplete=()=>res();tx.onerror=()=>res();}catch(e){res();}});
  }
};
const MODE_LABEL={claude:'Claudeアプリ内に保存',device:'この端末のブラウザに保存',none:'保存できません'};
async function load(){
  try{await store.init();}catch(e){store.mode='none';}
  try{const v=await store.get('stn-db');if(v)db=JSON.parse(v);}catch(e){}
  try{const v=await store.get('stn-thumbs');if(v)thumbs=JSON.parse(v);}catch(e){}
  db.items=db.items||[];db.orders=db.orders||[];
  render();
  if(store.mode==='none')toast('この画面では保存ができません。データは閉じると消えます');
}
async function saveDb(){const ok=await store.set('stn-db',JSON.stringify(db));if(!ok)toast('保存できませんでした（'+MODE_LABEL[store.mode]+'）');}
async function saveThumbs(){await store.set('stn-thumbs',JSON.stringify(thumbs));}
async function getPhoto(pid){return (await store.get('ph:'+pid))||'';}

function readAsDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('read'));r.readAsDataURL(f);});}
// blob: URLを使わず、データURL経由で読み込む（アプリ内表示で画像が読めない問題の対策）
async function compress(src,max,q){
  if(typeof src!=='string')src=await readAsDataURL(src);
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{try{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');
      c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',q));}catch(e){rej(new Error('canvas'));}};
    img.onerror=()=>rej(new Error('decode'));img.src=src;});
}
async function refreshThumb(item,fresh=[]){
  if(!item.photos||!item.photos.length){delete thumbs[item.id];await saveThumbs();return;}
  const first=item.photos[0];
  const src=(fresh.find(p=>p.pid===first)||{}).data||(form&&form.cache[first])||await getPhoto(first);
  if(src){try{thumbs[item.id]=await compress(src,240,0.7);}catch(e){}}
  await saveThumbs();
}

/* ---------- 描画 ---------- */
function render(){
  document.querySelectorAll('nav.tabs [data-k]').forEach(b=>b.classList.toggle('on',b.dataset.k===ui.tab));
  const alive=db.items.filter(i=>i.status!=='使い切り').length;
  $('#count').textContent=db.items.length?`${alive}点が棚に`:'';
  const v=$('#view');
  v.innerHTML=ui.tab==='shelf'?shelfHTML():ui.tab==='shop'?shopHTML():importHTML();
}
function phHTML(i){return thumbs[i.id]?`<img src="${thumbs[i.id]}" alt="">`:`<span class="ini">${esc((i.cat||'他').slice(0,1))}</span>`;}
function keysOf(i){
  switch(ui.group){
    case 'maker':return [i.maker||'作家未登録'];
    case 'tag':return (i.tags&&i.tags.length)?i.tags:['用途未登録'];
    case 'status':return [i.status||'未開封'];
    case 'place':return [i.place||'場所未登録'];
    default:return [CATS.includes(i.cat)?i.cat:'その他'];
  }
}
function pickOshi(){
  const c=db.items.filter(i=>i.status!=='使い切り');if(!c.length)return null;
  c.sort((a,b)=>(a.lastUsed||'0000')<(b.lastUsed||'0000')?-1:1);
  const pool=c.slice(0,Math.min(6,c.length));
  const seed=Number(today().replace(/-/g,''))+ui.oshi;
  return pool[seed%pool.length];
}
function shelfHTML(){
  let h=store.mode==='none'?`<p class="note warn" style="margin:8px 18px">この画面では保存ができないため、閉じると内容が消えます。</p>`:'';const o=pickOshi();
  if(o){
    const d=o.lastUsed?`最後に使ってから${daysSince(o.lastUsed)}日`:'まだ一度も使っていません';
    h+=`<section class="oshi"><button class="oshi-ph" data-act="open" data-id="${o.id}" aria-label="${esc(o.name)}を開く">${phHTML(o)}</button>
    <div class="oshi-body"><p class="oshi-lead">今日の推し</p><p class="oshi-name">${esc(o.name)}</p><p class="oshi-sub">${esc(d)}</p>
    <div class="oshi-btns"><button class="btn sm" data-act="use" data-id="${o.id}">今日使った</button><button class="btn sm on-dark" data-act="oshi-next">ほかの子</button></div></div></section>`;
  }
  h+=`<div class="ctrl"><input id="q" type="search" placeholder="名前・作家・色・用途で探す" value="${esc(ui.q)}">
  <div class="seg">${GROUPS.map(([k,l])=>`<button data-act="group" data-k="${k}" class="${ui.group===k?'on':''}">${l}別</button>`).join('')}</div>
  <div class="seg sub">${['all',...STATUS].map(s=>`<button data-act="status" data-k="${s}" class="${ui.status===s?'on':''}">${s==='all'?'すべて':s}</button>`).join('')}</div></div>
  <div id="shelves">${shelvesHTML()}</div>`;
  return h;

/* ---------- Claude API ---------- */
async function callClaude(content,tools){
  const body={model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content}]};
  if(tools)body.tools=tools;
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  let d;try{d=await r.json();}catch(_){throw new Error(`通信エラー（${r.status}）`);}
  if(!r.ok||d.error)throw new Error((d.error&&d.error.message)||`通信エラー（${r.status}）`);
  return (d.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
}
function parseJSON(t){const s=t.replace(/```json|```/g,'');const a=s.indexOf('{'),b=s.lastIndexOf('}');return JSON.parse(s.slice(a,b+1));}

{"name":"商品名","maker":"ブランドまたは作家","cat":"分類","color":"色（なければ空文字）"}
分類は次のどれか1つ：${CATS.join('、')}
特定できなければ {"name":""} だけを返してください。`}],[{type:'web_search_20250305',name:'web_search'}]);

async function readImport(){
  const ta=$('#imp-text');if(ta)imp.text=ta.value;
  if(!imp.images.length&&!imp.text.trim()){imp.msg='スクショかテキストを入れてください';render();return;}
  imp.busy=true;imp.msg='';render();
  const content=[...imp.images.map(s=>({type:'image',source:{type:'base64',media_type:'image/jpeg',data:s.split(',')[1]}})),
    {type:'text',text:IMPORT_PROMPT+(imp.text.trim()?'\n\n貼り付けテキスト：\n'+imp.text:'')}];
  try{
    const r=parseJSON(await callClaude(content));
    if(!r.orders||!r.orders.some(o=>(o.items||[]).length))imp.msg='文具の注文が見つかりませんでした。注文日と商品名が写るように撮り直してください。';
    else imp.result=r;
  }catch(e){imp.msg=`読み取れませんでした（原因：${e&&e.message?e.message:'不明'}）。量が多いときはスクショを2〜3枚ずつに分けるか、下の「チャットで読み取ったデータ」を使ってください。`;}
  imp.busy=false;render();
}

      const pv=r.querySelector('.r-price').value;const src=(orders[oi].items||[])[+r.dataset.ii]||{};

function purchases(){
  const map={};

    const p=map[k]=map[k]||{date:i.date,shop:i.shop,items:[],sum:0,total:null};p.items.push(i);p.sum+=(Number(i.price)||0)*(Number(i.qty)||1);});
  db.orders.forEach(o=>{const p=map[o.id]=map[o.id]||{date:o.date,shop:o.shop,items:[],sum:0};p.total=o.total;});
  return Object.values(map).map(p=>({...p,amount:p.total!=null&&p.total!==''?Number(p.total):p.sum})).sort((a,b)=>(b.date||'').localeCompare(a.date||''));

  const catRank=Object.entries(cats).filter(c=>c[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,6);
  return `<div class="wrap">
  <div class="stats"><div class="stat"><p>${y}年の買い物</p><b>${inY.length}回</b></div><div class="stat"><p>${y}年の合計</p><b>${yen(sum(inY))}</b></div><div class="stat"><p>今月の合計</p><b>${yen(sum(ps.filter(p=>(p.date||'').startsWith(ym))))}</b></div></div>
  <h2 class="sec">月ごとの金額</h2>
  <div class="bars">${months.map(m=>`<div class="bar ${m.key===ym?'now':''}" title="${m.label} ${yen(m.amt)}・${m.cnt}回"><i style="height:${Math.round(m.amt/max*88)}%"></i><span>${m.label.replace('月','')}</span></div>`).join('')}</div>
  <h2 class="sec">よく買うお店</h2>
  <ul class="rank">${shopRank.map(([s,v])=>`<li><span>${esc(s)}</span><span>${v.cnt}回・${yen(v.amt)}</span></li>`).join('')}</ul>
  ${catRank.length?`<h2 class="sec">${y}年の剤型別</h2><ul class="rank">${catRank.map(([c,v])=>`<li><span>${esc(c)}</span><span>${yen(v)}</span></li>`).join('')}</ul>`:''}
  <h2 class="sec">買い物の記録</h2>
  ${ps.map(p=>`<div class="order"><div class="otop"><span class="d">${esc(p.date||'日付なし')}</span><span class="s">${esc(p.shop||'購入先未登録')}</span><b>${yen(p.amount)}</b></div>
    <div class="chips">${p.items.map(i=>`<button class="chip" data-act="open" data-id="${i.id}">${esc(i.name)}</button>`).join('')}</div></div>`).join('')}
  </div>`;
}

/* ---------- イベント ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id,k=b.dataset.k;
  switch(a){
    case 'tab':closeSheet();ui.tab=k;render();window.scrollTo(0,0);break;
    case 'group':ui.group=k;render();break;
    case 'status':ui.status=k;render();break;
    case 'oshi-next':ui.oshi++;render();break;
    case 'open':openDetail(id);break;
    case 'add':openForm(null);break;
    case 'edit':openForm(id);break;
    case 'close':closeSheet();break;
    case 'use':markUsed(id);break;
    case 'save':b.disabled=true;await saveForm();break;
    case 'del':deleteItem(id);break;
    case 'jan':janLookup();break;
    case 'tag':{readForm();const t=form.item.tags;const n=t.indexOf(k);n>=0?t.splice(n,1):t.push(k);renderForm(true);break;}
    case 'rmphoto':{readForm();const f=form;if(f.newPhotos.some(p=>p.pid===k))f.newPhotos=f.newPhotos.filter(p=>p.pid!==k);
      else{f.item.photos=f.item.photos.filter(p=>p!==k);f.removed.push(k);}renderForm(true);break;}
    case 'rmimg':imp.images.splice(+k,1);render();break;
    case 'read':readImport();break;
    case 'commit':commitImport();break;
    case 'pastejson':{const v=$('#paste-json').value.trim();
      try{const r=parseJSON(v);if(!r.orders||!r.orders.length)throw 0;imp.result=r;imp.msg='';render();
        setTimeout(()=>{const el=document.querySelector('.review');if(el)el.scrollIntoView({behavior:'smooth'});},50);}
      catch(_){toast('データとして読めませんでした。チャットの枠内をそのまま貼り付けてください');}break;}
    case 'backup':{const t=JSON.stringify(db);try{await navigator.clipboard.writeText(t);toast('控えをコピーしました。メモアプリなどに貼って保管してください');}
      catch(_){const r=$('#restore');r.value=t;r.select();toast('コピーできなかったので下の欄に表示しました');}break;}
    case 'restore':{const v=$('#restore').value.trim();if(!v){toast('控えのテキストを貼り付けてください');break;}
      if(!restoreArm){restoreArm=true;b.textContent='もう一度押すと置き換えます';break;}
      try{const d=JSON.parse(v);if(!Array.isArray(d.items))throw 0;db={items:d.items,orders:d.orders||[]};await saveDb();restoreArm=false;ui.tab='shelf';render();toast('控えから復元しました');}
      catch(_){restoreArm=false;toast('控えのテキストとして読めませんでした');render();}break;}
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){ui.q=e.target.value;$('#shelves').innerHTML=shelvesHTML();}
  if(e.target.id==='imp-text')imp.text=e.target.value;
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='imp-file'){for(const f of t.files){try{imp.images.push(await compress(f,1568,0.82));}catch(_){toast('画像を読み込めませんでした');}}render();}
  else if(t.id==='f-photos'){readForm();for(const f of t.files){try{form.newPhotos.push({pid:uid(),data:await compress(f,1200,0.78)});}catch(_){toast('画像を読み込めませんでした');}}renderForm(true);}
  else if(t.dataset&&t.dataset.quickphoto){
    const id=t.dataset.quickphoto,i=db.items.find(x=>x.id===id);i.photos=i.photos||[];toast('写真を保存しています…');const added=[];let bad=0,fail=0;
    for(const f of t.files){let data;try{data=await compress(f,1200,0.78);}catch(_){bad++;continue;}
      const pid=uid();if(await store.set('ph:'+pid,data)){i.photos.push(pid);added.push({pid,data});}else fail++;}
    if(added.length){await refreshThumb(i,added);await saveDb();}
    toast(added.length?`写真を${added.length}枚追加しました`:bad?'写真を読み込めませんでした（画像の形式を開けません）':`写真を保存できませんでした（${MODE_LABEL[store.mode]}）`);
    openDetail(id);render();
  }
});

load().catch(e=>showFatal(e&&e.message?e.message:e));
</script>
</body>
